<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SOTA SUITE Housekeeping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app. One list per screen, big tap targets. Desktop gets a left rail. Dark-first, champagne accent. Status colour is used only on a thin bar and the status text. */
:root{
  --bg:#0D0F12; --surface:#171A1F; --surface-2:#20242B; --line:#2C3038; --fg:#F3EFE7; --muted:#9B978F;
  --accent:#E7C88F; --accent-ink:#1B1609; --accent-soft:rgba(231,200,143,.13);
  --s-vd:#F06A5A; --s-od:#F2C14E; --s-vc:#5FA8F5; --s-ins:#4FCB8A; --s-arr:#4FD1C5; --s-oc:#8C919B; --s-ooo:#5F6570;
  --danger:#F06A5A; --ok:#4FCB8A; --warn:#F2C14E; --on-color:#14110B;
  --logo-f:invert(1) brightness(.96);
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --f-display:"Unbounded","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F1EB; --surface:#FFFFFF; --surface-2:#ECE8E0; --line:#DCD6CA; --fg:#1A1B1F; --muted:#67655F;
  --accent:#8E6A2A; --accent-ink:#FFFFFF; --accent-soft:rgba(142,106,42,.11);
  --s-vd:#D2412F; --s-od:#B98A0B; --s-vc:#2A74C9; --s-ins:#23935A; --s-arr:#12877D; --s-oc:#7C818B; --s-ooo:#A2A7AF;
  --danger:#D2412F; --ok:#23935A; --warn:#B98A0B; --on-color:#FFFFFF; --logo-f:none; --shadow:0 20px 60px rgba(40,30,10,.16); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F1EB; --surface:#FFFFFF; --surface-2:#ECE8E0; --line:#DCD6CA; --fg:#1A1B1F; --muted:#67655F;
  --accent:#8E6A2A; --accent-ink:#FFFFFF; --accent-soft:rgba(142,106,42,.11);
  --s-vd:#D2412F; --s-od:#B98A0B; --s-vc:#2A74C9; --s-ins:#23935A; --s-arr:#12877D; --s-oc:#7C818B; --s-ooo:#A2A7AF;
  --danger:#D2412F; --ok:#23935A; --warn:#B98A0B; --on-color:#FFFFFF; --logo-f:none; --shadow:0 20px 60px rgba(40,30,10,.16); color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* brand */
.logo{display:block;height:46px;width:auto;align-self:flex-start;flex:none;object-fit:contain;filter:var(--logo-f)}
.logo.lg{height:56px}
.wm{display:inline-flex;flex-direction:column;line-height:1;color:var(--fg)}
.wm-name{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.22em;white-space:nowrap}
.wm-sub{font-size:9px;letter-spacing:.42em;color:var(--muted);margin-top:6px;padding-top:5px;border-top:1px solid var(--line)}
.wm.lg .wm-name{font-size:clamp(24px,4vw,38px)}
.wm.lg .wm-sub{font-size:11px;margin-top:10px;padding-top:9px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:46px}
.btn:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.06)}
.btn-ghost{background:transparent}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn-clean{background:var(--s-ins);border-color:var(--s-ins);color:var(--on-color)}
.btn-danger{color:var(--danger)}
.btn-danger.armed{background:var(--danger);border-color:var(--danger);color:var(--on-color)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.input{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:46px}
.input:focus{outline:none;border-color:var(--accent)}
.input-sm{min-height:36px;padding:6px 10px;width:auto;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.langs{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px}
.langs button{border:0;background:transparent;border-radius:9px;padding:6px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.lang-sel{display:none;width:auto;min-height:42px;padding:8px 10px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);white-space:nowrap}
.tag.warn{color:var(--warn)} .tag.danger{color:var(--danger)} .tag.ok{color:var(--ok)} .tag.gold{color:var(--accent)} .tag.arr{color:var(--s-arr)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--c);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.mark{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.mark.in{color:var(--s-arr)} .mark.out{color:var(--fg)} .mark.vip{color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.avatar.sm{width:26px;height:26px;font-size:10px}
.faces{display:inline-flex}
.faces .avatar{border:2px solid var(--surface)}
.faces .avatar + .avatar{margin-left:-8px}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1.15fr 1fr}
.login-art{position:relative;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%}
.login-art > *:not(canvas){position:relative}
.claim{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.6vw,32px);line-height:1.25;max-width:18ch}
.claim b{font-weight:600;color:var(--accent)}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.role-card{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.role-card:hover{border-color:var(--accent)}
.role-card svg{width:22px;height:22px;color:var(--accent)}
.role-card b{font-weight:500;font-size:13px;line-height:1.25}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.rail .brand{padding:0 8px}
.rail nav{display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:11px 12px;color:var(--muted);text-align:left;width:100%}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{color:var(--fg);background:var(--surface-2)}
.nav-btn[aria-current="page"]{color:var(--fg);background:var(--accent-soft)}
.nav-btn[aria-current="page"] svg{color:var(--accent)}
.nav-btn .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me-card{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2)}
.me-card div{min-width:0}
.me-card b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card span{font-size:11px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar .brand{display:none}
.topbar .spacer{flex:1}
.concept{font-size:11px;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:3px 10px;white-space:nowrap}
.content{padding-block:8px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3vw,34px);line-height:1.1}
.page-head .spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px;font-weight:500}
.panel-head .spacer{flex:1}
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}

/* maid home */
.hello h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.2vw,36px);line-height:1.15}
.hello h1 b{font-weight:600}
.today{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.today .grow{flex:1;min-width:180px}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 18px;position:relative;text-align:left;width:100%}
.rrow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.rrow .no{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1;min-width:70px}
.rrow .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rrow .info .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rrow.done{opacity:.6}

/* board */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.kpi b{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1}
.floors{display:flex;flex-direction:column;gap:10px}
.floor{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:stretch}
.floor-label{font-family:var(--f-display);font-weight:600;font-size:20px;display:flex;align-items:center;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.room{position:relative;border:1px solid var(--line);border-radius:14px;padding:9px 9px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:92px;background:var(--surface);color:var(--fg);overflow:hidden}
.room::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.room:hover{border-color:var(--c)}
.room.dim{opacity:.18}
.room.picked{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.room .no{font-family:var(--f-mono);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.room .lbl{font-size:11px;font-weight:600;line-height:1.25;color:var(--c)}
.room .sub{font-size:10px;color:var(--muted);line-height:1.3}
.room .who{font-size:10px;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.room .cam{color:var(--accent)}
.room .tick{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted)}
.room.picked .tick{background:var(--accent);border-color:var(--accent)}
.assign-bar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--accent);border-radius:18px;z-index:6}
.assign-bar .input{flex:1;min-width:160px;width:auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.55);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
.sheet-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sheet-head .big{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}
.sheet-body{overflow:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:20px;flex:1}
.sheet-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14px;min-width:0}
.fact span{display:block;font-size:11px;color:var(--muted)}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{border:1.5px dashed var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:14px;display:flex;gap:10px;align-items:center;color:var(--muted);text-align:left;min-height:52px}
.check i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px}
.check[aria-pressed="true"]{border-style:solid;border-color:var(--ok);color:var(--fg);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.check[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok);color:var(--on-color)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line);margin:0}
.ph .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;padding:0}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shoot label{cursor:pointer}
.shoot .btn{border-style:dashed;min-height:64px;flex-direction:column;gap:4px;font-size:13px}
.shoot .btn svg{width:22px;height:22px;color:var(--accent)}
.need{font-size:12px;color:var(--muted);text-align:center}
.timeline{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);padding-left:14px}
.timeline div{position:relative;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-18px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.timeline time{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.team-top{display:flex;align-items:center;gap:10px}
.team-top b{font-weight:500;flex:1;min-width:0}
.members{display:flex;flex-wrap:wrap;gap:6px}
.member{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
.stats3 b{display:block;font-family:var(--f-mono);font-size:16px}
.room-chips{display:flex;flex-wrap:wrap;gap:4px}
.room-chips button{font-family:var(--f-mono);font-size:11px;border:0;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--c);border-left:3px solid var(--c)}

/* schedule */
.sched td,.sched th{padding:8px 6px;text-align:center}
.sched td:first-child,.sched th:first-child{text-align:left;padding-left:16px;position:sticky;left:0;background:var(--surface);z-index:1}
.sched th.tcol,.sched td.tcol{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.shift{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:58px;padding:6px 4px;font-size:12px;line-height:1.2;display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.shift.w{color:var(--fg);border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.shift.off{color:var(--muted);background:transparent;border-style:dashed}
.shift .ot{font-family:var(--f-mono);font-size:11px;color:var(--warn)}
.sched tr.me td{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.msched{border-collapse:separate;border-spacing:0;font-size:12px}
.msched th,.msched td{padding:3px 1px;text-align:center;border-bottom:1px solid var(--line)}
.msched th:first-child,.msched td:first-child{text-align:left;padding:4px 12px 4px 16px;position:sticky;left:0;background:var(--surface);z-index:1;white-space:nowrap}
.msched th{font-weight:500;color:var(--muted);line-height:1.15}
.msched th b{display:block;color:var(--fg);font-family:var(--f-mono);font-weight:500;font-size:12px}
.msched .we{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.msched .tcol{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.msched th.tcol b{color:var(--accent)}
.msched td.sum{font-family:var(--f-mono);padding:0 10px;white-space:nowrap}
.msched thead th:nth-last-child(-n+2){padding:0 8px;white-space:nowrap}
.msched tfoot td{font-family:var(--f-mono);color:var(--muted);border-bottom:0;padding-top:8px}
.msched tr.me td:first-child{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.dc{width:26px;height:30px;border-radius:7px;border:1px solid transparent;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1;padding:0;background:transparent;color:var(--muted)}
.dc.w{background:color-mix(in srgb,var(--ok) 22%,var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--fg)}
.dc.off{border:1px dashed var(--line)}
.dc .ot{font-family:var(--f-mono);font-size:9.5px;color:var(--warn);font-weight:600;margin-top:1px}
button.dc:hover{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.mon-sw{display:inline-flex;align-items:center;gap:6px}
.mon-sw b{font-weight:500;min-width:120px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.legend .dc{width:18px;height:20px;cursor:default}
.ot-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}

/* stock */
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.loc{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.loc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px -6px var(--accent)}
.loc .name{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1}
.loc.main-store{grid-column:span 2}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:visible}
.meter i{display:block;height:100%;border-radius:99px;background:var(--m,var(--ok));box-shadow:0 0 6px color-mix(in srgb,var(--m,var(--ok)) 80%,transparent),0 0 16px color-mix(in srgb,var(--m,var(--ok)) 45%,transparent)}
.stock-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.stock-row:last-child{border-bottom:0}
.stock-row .nm{display:flex;flex-direction:column;min-width:0}
.stock-row .nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{display:flex;flex-direction:column;gap:7px}
.qty .mono{font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stk-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.access{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;margin-bottom:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.access .ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.access .ico svg{width:18px;height:18px}
.access b{font-weight:600}.access p{margin-top:4px;max-width:70ch;line-height:1.5}
.acc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stepper button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1}
.matrix td,.matrix th{padding:9px 10px;text-align:center;font-family:var(--f-mono);font-size:12px}
.matrix td:first-child,.matrix th:first-child{text-align:left;font-family:var(--f-body);font-size:13px;position:sticky;left:0;background:var(--surface);z-index:1}
.cell{display:inline-block;min-width:38px;padding:3px 6px;border-radius:7px;border:0;background:color-mix(in srgb,var(--m) 16%,transparent);color:var(--fg);box-shadow:0 0 10px -3px var(--m)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--m);box-shadow:0 0 8px var(--m)}

/* lost, chat, admin */
.lf{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.lf:last-child{border-bottom:0}
.lf-ph{width:60px;height:60px;border-radius:14px;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);flex:none}
.lf-ph svg{width:22px;height:22px}
.lf-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lf-meta{font-size:12px;color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.form{display:flex;flex-direction:column;gap:12px;padding:18px}
#lf-preview{max-width:100%;max-height:160px;border-radius:12px;object-fit:cover}
.chat{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.chans{display:flex;flex-direction:column;gap:4px}
.chan{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:14px;padding:9px 10px;text-align:left;color:var(--muted)}
.chan[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.chan .count{margin-left:auto;font-family:var(--f-mono);font-size:11px}
.msgs{overflow:auto;height:min(54vh,520px);padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:85%}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.bw{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg.mine .bw{align-items:flex-end}
.msg-meta{font-size:11px;color:var(--muted)}
.msg-meta b{color:var(--fg);font-weight:500}
.bubble{background:var(--surface-2);border-radius:5px 16px 16px 16px;padding:9px 13px;overflow-wrap:anywhere}
.msg.mine .bubble{background:var(--accent);color:var(--accent-ink);border-radius:16px 5px 16px 16px}
.orig{font-size:11px;color:var(--muted)}
.rtag{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 5px;font-size:13px}
.msg.mine .rtag{background:rgba(0,0,0,.15);color:inherit}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px}
.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.switch{width:44px;height:26px;border-radius:99px;border:0;background:var(--surface-2);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent-soft)}
.switch[aria-checked="true"]::after{left:22px;background:var(--accent)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:18px;background:var(--accent-soft);color:var(--fg);font-size:14px}
.notice svg{width:20px;height:20px;color:var(--accent);flex:none;margin-top:1px}
.temp{border:1px dashed var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.temp .mono{font-size:22px;letter-spacing:.1em;color:var(--accent)}
.perm td:not(:first-child),.perm th:not(:first-child){text-align:center}
.perm input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* dashboard + issue tracking */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dash>.panel{min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi small{color:var(--muted);font-size:12px}
.kpi b.money{font-size:26px}
.pbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:10px;border-radius:99px;background:var(--surface-2);position:relative}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--m,var(--accent));box-shadow:0 0 10px color-mix(in srgb,var(--m,var(--accent)) 55%,transparent)}
.hbar .tr .avg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5;border-radius:2px}
.hbar .v{font-family:var(--f-mono);font-size:12px;white-space:nowrap;text-align:right}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%;background:var(--m)}
.slegend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--muted)}
.slegend span{display:inline-flex;align-items:center;gap:6px}.slegend b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.slegend i{width:9px;height:9px;border-radius:3px;background:var(--m)}
.insight{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.insight .ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800}
.insight b{font-weight:600}
.ilog{width:100%;border-collapse:collapse;font-size:13px}
.ilog th,.ilog td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.ilog th{font-weight:500;color:var(--muted);font-size:12px}
.ilog td.n{font-family:var(--f-mono);text-align:right}
.ilog tr.new td{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px}
.spark i{flex:1;background:color-mix(in srgb,var(--accent) 70%,transparent);border-radius:3px 3px 0 0;min-height:2px}
.spark i.t{background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.issue-form{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) 90px auto;gap:8px;align-items:end;padding:14px 18px;border-top:1px solid var(--line)}
.issue-form label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.lowlist{display:flex;flex-direction:column}
.lowlist button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);font-size:13px}
.lowlist button:last-child{border-bottom:0}
@media (max-width:760px){.kpi b.money{font-size:21px}.hbar{grid-template-columns:84px minmax(0,1fr) auto;gap:8px;font-size:12px}.ilog th:last-child,.ilog td:last-child{display:none}}
@media (max-width:1100px){.dash>.panel,.dash>.insight{grid-column:span 12}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.issue-form{grid-template-columns:1fr 1fr}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.rooms{grid-template-columns:repeat(5,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}}
@media (max-width:760px){
  .login{grid-template-columns:1fr}
  .login-art{min-height:260px;border-right:0;border-bottom:1px solid var(--line);padding:28px max(16px,env(safe-area-inset-left,0px))}
  .roles{grid-template-columns:1fr}
  .role-card{flex-direction:row;align-items:center}
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .rail .brand,.rail-foot{display:none}
  .rail nav{flex-direction:row;width:100%;overflow-x:auto;scrollbar-width:none}
  .nav-btn{flex:1 0 64px;flex-direction:column;gap:3px;font-size:10px;padding:7px 4px;align-items:center;text-align:center}
  .nav-btn .count{display:none}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{display:block}
  .topbar .logo{height:34px}
  .topbar .wm-name{font-size:13px}.topbar .wm-sub{display:none}
  .topbar .concept,.topbar .langs{display:none}
  .topbar .lang-sel{display:block}
  .content{padding-bottom:104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .floor{grid-template-columns:1fr}
  .rooms{grid-template-columns:repeat(3,minmax(0,1fr))}
  .assign-bar{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .chat{grid-template-columns:1fr}.chans{flex-direction:row;overflow-x:auto}.chan{white-space:nowrap}.chan .count{display:none}
  .msg{max-width:100%}
  .loc.main-store{grid-column:1/-1}
  .locs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stock-row{grid-template-columns:minmax(0,1fr) auto}
  .stock-row .qty{grid-column:1/-1;grid-row:2}
  .sheet{top:auto;left:0;width:100%;max-height:92%;border-left:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;animation:up .22s ease;padding-left:env(safe-area-inset-left,0px)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

views.sched = function(){

          return `<td class="${cls(d)}">${edit?`<button class="${k}" data-act="shift" data-v="${s.id}" data-d="${d}" aria-label="${esc(sName(s))} ${d+1}">${inner}</button>`:`<span class="${k}">${inner}</span>`}</td>`; }).join("")}

        <form class="form" data-form="member">
          <div class="field"><label for="nm-name">${t("name")}</label><input class="input" id="nm-name" autocomplete="off" placeholder="${lang==="ko"?"이름":lang==="ru"?"Анна":"Anna"}"></div>
          <div class="field"><label for="nm-role">${t("role")}</label><select class="input" id="nm-role">${["att","hk","sup","admin"].map(r=>`<option value="${r}">${t("role_"+r)}</option>`).join("")}</select></div>
          <button class="btn btn-primary" type="submit">${t("create")}</button>
          ${S.tempPw?`<div class="temp"><span class="eyebrow">${t("temp_pw")} · ${esc(S.tempPw.login)}</span><span class="mono">${S.tempPw.pw}</span><span class="muted small">${t("temp_hint")}</span></div>`:""}
        </form></section>
      <section class="panel"><div class="panel-head"><h2>${t("perms")}</h2></div><div class="table-wrap"><table class="perm">
        <thead><tr><th></th>${["att","hk","sup","admin"].map(r=>`<th>${t("role_"+r)}</th>`).join("")}</tr></thead>
        <tbody>${Object.keys(PERMS).map(p=>`<tr><td style="white-space:normal">${t("p_"+p)}</td>${["att","hk","sup","admin"].map(r=>`<td><input type="checkbox" id="perm-${p}-${r}" data-act="perm" data-v="${p}" data-r="${r}" ${PERMS[p][r]?"checked":""} ${r==="admin"?"disabled":""} aria-label="${t("p_"+p)} · ${t("role_"+r)}"></td>`).join("")}</tr>`).join("")}</tbody>
      </table></div></section>
    </div>
  </div>`;
};

/* ================= actions ================= */
let toastTimer;
function toast(msg){ S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=""; const el=document.querySelector(".toast"); if(el) el.remove(); }, 2600); }
const STLOG = {INS:"log_inspect",ARR:"log_inspect",VD:"log_dirty",OOO:"log_ooo"};
function setStatus(r, st){
  if(st==="INS" && r.arrAt) st = "ARR";
  const prev = r.st; r.st = st;
  r.log.push({t:NOW, k: prev==="OOO"&&st==="VD" ? "log_back" : STLOG[st], who: whoAmI()});
  toast(t("t_status",{r:r.no, s:stLabel(r)}));
}
function go(v){ S.view = v; S.schedX = null; S.open = null; S.finish = null; S.assign = false; S.picked.clear(); try{ history.replaceState(null,"","#"+v); }catch(e){} render(); window.scrollTo(0,0); }
function shrink(file){ return new Promise(res=>{
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900/Math.max(im.width,im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); try{ res(c.toDataURL("image/jpeg",.78)); }catch(e){ res(fr.result); } }; im.onerror = () => res(null); im.src = fr.result; };
  fr.onerror = () => res(null); fr.readAsDataURL(file);
}); }

app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v, room = b.dataset.room ? rooms.find(r=>r.no==b.dataset.room) : null;
  if(["perm","rteam","mteam","urole","otday","oth","otwho","isteam","langsel","skitem"].includes(a)) return;
  if(a!=="udel") S.delArm = null;
  switch(a){
    case "lang": lang = v; try{localStorage.setItem("ss-lang",v);}catch(_){} break;
    case "login": S.role = v; S.view = v==="att" ? "home" : v==="hk" ? "stock" : "dash"; S.stockMode = "loc"; break;
    case "logout": S.role = null; S.open = null; S.finish = null; S.assign = false; break;
    case "go": go(v); return;
    case "theme": { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      const nx = cur==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx); try{localStorage.setItem("ss-theme",nx);}catch(_){} if(!S.role) startArt(); return; }
    case "homef": S.homeF = v; break;
    case "filter": S.filter = S.filter===v && v!=="all" ? "all" : v; break;
    case "room": S.open = +v; S.finish = null; break;
    case "close": S.open = null; break;
    case "setst": setStatus(room, v); break;
    case "checkout": room.st = "VD"; room.log.push({t:NOW,k:"log_out",who:whoAmI()}); toast(t("t_co",{r:room.no})); break;
    case "finish": S.finish = +v; S.open = null; S.finPhotos = []; S.finChecks = {}; break;
    case "closefin": S.finish = null; break;
    case "fincheck": S.finChecks[v] = !S.finChecks[v]; break;
    case "rmphoto": S.finPhotos.splice(+v,1); break;
    case "demophoto": S.finPhotos.push(samplePhoto(PH_KIND[S.finPhotos.length%3], S.finPhotos.length+7)); break;
    case "findone": { const r = rooms.find(x=>x.no===+v); const tm = teamById(r.team) || myTeam();
      r.st = (r.st==="OD" && !r.flags.dep) ? "OC" : "VC";
      r.credit = tm ? tm.members.slice() : [S.me];
      r.photos = S.finPhotos.map(src=>({src, who:meObj(), t:NOW}));
      r.log.push({t:NOW,k:"log_finish",who: whoAmI() + (tm && tm.members.length>1 ? " ("+teamName(tm)+")" : "")});
      S.finish = null; S.finPhotos = []; S.finChecks = {}; toast(t("t_fin",{r:r.no})); break; }
    case "assignmode": S.assign = !S.assign; S.picked.clear(); break;
    case "pick": { const no = +v; S.picked.has(no) ? S.picked.delete(no) : S.picked.add(no); break; }
    case "doassign": { const tid = document.getElementById("assign-team").value, tm = teamById(tid);
      S.picked.forEach(no=>{ const r = rooms.find(x=>x.no===no); r.team = tid; r.log.push({t:NOW,k:"log_assign",who:teamName(tm)}); });
      toast(t("t_assigned",{n:S.picked.size, team:teamName(tm)})); S.picked.clear(); break; }
    case "newteam": TEAMS.push({id:"t"+(TEAMS.length+1), members:[], floors:[]}); toast(t("t_newteam")); break;
    case "shift": { const c = SCHEDS[S.mon][v][+b.dataset.d]; c.w = !c.w; if(!c.w) c.ot = 0; break; }
    case "mon": S.mon = +v; S.schedX = null; break;
    case "fill52": { STAFF.forEach((s,ix)=>{ SCHEDS[S.mon][s.id] = fill52(S.mon,ix+1); }); toast(t("t_fill",{m:MONTHS[S.mon].name[L[lang]]})); break; }
    case "otadd": { const d = S.otDay, tm = teamById(S.otWho), ids = tm ? tm.members : [S.otWho];
      ids.forEach(id=>{ const c = SCHEDS[S.mon][id][d]; c.w = true; c.ot += S.otH; });
      toast(t("t_ot",{d:dayLabel(S.mon,d), who: tm ? teamName(tm) : sName(staffById(S.otWho)), h:S.otH})); break; }
    case "otreset": STAFF.forEach(s=>SCHEDS[S.mon][s.id][S.otDay].ot = 0); break;
    case "stockgo": S.view = "stock"; S.stockMode = "loc"; S.stockLoc = +v; try{ history.replaceState(null,"","#stock"); }catch(_){} window.scrollTo(0,0); break;
    case "stockmode": S.stockMode = v; break;
    case "issuego": S.stockMode = "issue"; go("stock"); return;
    case "stockcat": S.stockCat = v; break;
    case "stockloc": S.stockLoc = +v; break;
    case "sheet": { const k = b.dataset.k, id = v || itemsAt(S.stockLoc)[0].id; S.sheet = {k, it:id, q:k==="in"?10:k==="took"?1:5, tm:null}; break; }
    case "closestk": S.sheet = null; break;
    case "sktm": S.sheet.tm = v; break;
    case "skq": { const el = document.getElementById("sk-q"); S.sheet.q = Math.max(1, (+el.value||1) + (+b.dataset.d)); break; }
    case "skqset": S.sheet.q = +v; break;
    case "stock": { const q = STOCK[S.stockLoc], dd = +b.dataset.d; q[v] = Math.max(0, q[v] + dd);
      if(dd<0 && RATE[v]!=null){ const tm = S.role==="att" ? myTeam() : null; if(tm){ ISSUES.push({d:TODAY, tm:tm.id, it:v, q:1, by:S.me, tm_:NOW, fresh:true}); } } break; }
    case "refill": { const loc = +v; let n = 0; itemsAt(loc).forEach(it=>{ if(STOCK[loc][it.id] < it.par){ STOCK[loc][it.id] = it.par; n++; } });
      toast(n ? t("t_refill",{loc:floorLabel(loc),n}) : t("t_nofill")); break; }
    case "lfret": LOST[+v].st = "returned"; toast(t("t_ret")); break;
    case "chan": S.chan = v; break;
    case "tr": S.tr = !S.tr; break;
    case "quick": MSGS[S.chan].push({who:meObj(), t:NOW, lang, text:t(v)}); break;
    case "udel": { if(S.delArm!==v){ S.delArm = v; break; } const ix = USERS.findIndex(u=>u.login===v); const nm = sName(USERS[ix].u); USERS.splice(ix,1); S.delArm = null; toast(t("t_deleted",{n:nm})); break; }
    default: return;
  }
  render();
});
app.addEventListener("change", async e=>{
  const el = e.target, a = el.dataset.act;
  if(a==="perm"){ PERMS[el.dataset.v][el.dataset.r] = el.checked ? 1 : 0; }
  if(a==="urole"){ USERS[+el.dataset.v].role = el.value; }
  if(a==="langsel"){ lang = el.value; try{localStorage.setItem("ss-lang",lang);}catch(_){} render(); }
  if(a==="rteam"){ const r = rooms.find(x=>x.no===+el.dataset.v); r.team = el.value || null; if(r.team) r.log.push({t:NOW,k:"log_assign",who:teamName(teamById(r.team))}); render(); }
  if(a==="mteam"){ const sid = el.dataset.v; TEAMS.forEach(x=>{ x.members = x.members.filter(id=>id!==sid); }); const tm = teamById(el.value); if(tm) tm.members.push(sid); toast(t("t_moved",{p:sName(staffById(sid)), team:teamName(tm)})); render(); }
  if(a==="otday"){ S.otDay = +el.value; }
  if(a==="oth"){ S.otH = +el.value; }
  if(a==="otwho"){ S.otWho = el.value; }
  if(a==="isteam"){ S.issTeam = el.value; render(); }
  if(a==="skitem"){ S.sheet.it = el.value; const q = document.getElementById("sk-q"); if(q) S.sheet.q = Math.max(1,+q.value||1); render(); }
  if(el.dataset.photo && el.files && el.files.length){ const out = await Promise.all([...el.files].slice(0,8).map(shrink)); S.finPhotos.push(...out.filter(Boolean)); render(); }
  if(el.id==="lf-file" && el.files && el.files[0]){ const src = await shrink(el.files[0]); const im = document.getElementById("lf-preview"); if(im && src){ im.src = src; im.hidden = false; } }
});
app.addEventListener("input", e=>{
  if(e.target.dataset.input==="q"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById("room-search"); if(s){ s.focus(); try{s.setSelectionRange(pos,pos);}catch(_){} } }
});
app.addEventListener("submit", e=>{
  e.preventDefault();
  const f = e.target.dataset.form;
  if(f==="login"){ S.role = "att"; S.view = "home"; render(); return; }
  if(f==="chat"){ const inp = document.getElementById("chat-input"); const v = inp.value.trim(); if(!v) return;
    MSGS[S.chan].push({who:meObj(), t:NOW, lang, text:v}); render(); const ni = document.getElementById("chat-input"); if(ni) ni.focus(); return; }
  if(f==="issue"){ const tm = teamById(document.getElementById("is-team").value), id = document.getElementById("is-item").value, q = Math.max(1, +document.getElementById("is-q").value||1), it = itemById(id);
    ISSUES.push({d:TODAY, tm:tm.id, it:id, q, by:meObj().id, tm_:NOW, fresh:true});
    if(q > STOCK[it.at][id]){ toast(t("t_short",{n:STOCK[it.at][id],u:it.u[L[lang]]})); render(); return; } STOCK[it.at][id] -= q; ISSUES[ISSUES.length-1].by = meObj().id;
    toast(t("t_issued",{team:teamName(tm), item:it.n[L[lang]], q, u:it.u[L[lang]]})); render(); return; }
  if(f==="stk"){ const sh = S.sheet, it = itemById(sh.it), q = Math.max(1, +document.getElementById("sk-q").value||1), have = STOCK[it.at][it.id], u = it.u[L[lang]], item = it.n[L[lang]];
    if(sh.k!=="in" && q>have){ toast(t("t_short",{n:have,u})); render(); return; }
    if(sh.k==="in"){ STOCK[it.at][it.id] = have + q; toast(t("t_in",{item,q,u})); }
    else { STOCK[it.at][it.id] = have - q; ISSUES.push({d:TODAY, tm: sh.k==="took" ? "rc" : sh.tm, it:it.id, q, by:meObj().id, tm_:NOW, fresh:true});
      toast(sh.k==="took" ? t("t_took",{item,q,u}) : t("t_issued",{team:teamName(teamById(sh.tm)), item, q, u})); }
    S.sheet = null; S.stockLoc = it.at; render(); return; }
  if(f==="lost"){
    const no = +document.getElementById("lf-room").value.trim(), item = document.getElementById("lf-item").value.trim();
    const room = rooms.find(r=>r.no===no);
    if(!room || !item){ toast(t("lf_err")); render(); return; }
    const im = document.getElementById("lf-preview");
    LOST.unshift({d:"10/28 "+NOW, room:no, item, desc:document.getElementById("lf-desc").value.trim(), where:+document.getElementById("lf-where").value, by:meObj(), st:"stored", photo: im && !im.hidden ? im.src : null});
    room.log.push({t:NOW,k:"log_lost",who:whoAmI()}); toast(t("t_lf")); render(); return;
  }
  if(f==="member"){
    const name = document.getElementById("nm-name").value.trim();
    if(!name){ toast(t("name_err")); render(); return; }
    const role = document.getElementById("nm-role").value;
    const ascii = name.normalize("NFKD").replace(/[^a-zA-Z]/g,"").toLowerCase();
    const login = (role==="att"?"hk.":role==="sup"?"front.":"admin.") + (ascii || "user"+(USERS.length+1));
    USERS.push({u:{id:"n"+USERS.length, n:[name,name,name]}, role, login, last:"—"});
    const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let pw = ""; for(let i=0;i<8;i++){ pw += abc[Math.floor(Math.random()*abc.length)]; if(i===3) pw += "-"; }
    S.tempPw = {login, pw}; toast(t("t_created",{n:name})); render();
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && (S.open||S.finish)){ S.open=null; S.finish=null; render(); } });

/* ================= login art: a corridor of doors lighting up ================= */
let artRaf = null;
function startArt(){
  stopArt();
  const c = document.getElementById("art"); if(!c) return;
  const ctx = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--s-vd","--s-vc","--s-ins","--accent"].map(v=>cs.getPropertyValue(v).trim());
  const line = cs.getPropertyValue("--line").trim();
  const r2 = rng(77); const cells = []; for(let i=0;i<300;i++) cells.push({c:Math.floor(r2()*cols.length), ph:r2()*6.28, sp:.25+r2()*.7});
  const size = () => { const d = devicePixelRatio||1; c.width = c.clientWidth*d; c.height = c.clientHeight*d; ctx.setTransform(d,0,0,d,0,0); };
  size();
  function draw(tm){
    const w=c.clientWidth, h=c.clientHeight; ctx.clearRect(0,0,w,h);
    const dw=22, dh=40, gx=14, gy=22, nx=Math.ceil(w/(dw+gx))+1, ny=Math.ceil(h/(dh+gy))+1;
    for(let y=0;y<ny;y++) for(let x=0;x<nx;x++){
      const cell = cells[(y*nx+x)%cells.length], px = x*(dw+gx)+10, py = y*(dh+gy)+6;
      const fade = Math.max(0, (px/w)*1.3-.25) * Math.max(0, (py/h)*1.25-.1);
      const a = (reduce ? .5 : .3+.4*Math.sin(tm/1000*cell.sp+cell.ph)) * fade;
      ctx.globalAlpha = .7*fade; ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.strokeRect(px+.5,py+.5,dw,dh);
      ctx.globalAlpha = Math.max(0,a); ctx.fillStyle = cols[cell.c]; ctx.beginPath(); ctx.arc(px+dw-6, py+dh/2, 1.8, 0, 6.3); ctx.fill(); ctx.fillRect(px+4, py+dh+4, dw-8, 2);
    }
    ctx.globalAlpha = 1;
    if(!reduce) artRaf = requestAnimationFrame(draw);
  }
  artRaf = requestAnimationFrame(draw);
  window.onresize = () => { if(document.getElementById("art")) size(); };
}
function stopArt(){ if(artRaf) cancelAnimationFrame(artRaf); artRaf = null; }

const h = location.hash.slice(1);
if(NAV[h]){ S.role = h==="home" ? "att" : h==="admin" ? "admin" : "sup"; S.view = h; }
render();
})();
